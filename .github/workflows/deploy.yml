name: Deploy to GitHub Pages

# The book moved to the blog. This publishes the redirect site generated by the
# template's tools/old_host_redirect.py; regenerate it with that tool.

on:
  push:
    branches: [main]
    paths: ['old-host-redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: old-host-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
