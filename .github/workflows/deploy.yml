name: Deploy to GitHub Pages

# The book now lives at https://www.wayneh.tw/books/cairn-barebones/. GitHub Pages
# cannot send a 301, so this publishes a redirect site: every old page path gets a
# meta-refresh + canonical page pointing at the same path on the blog, and 404.html
# forwards any other path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TARGET_BASE: https://www.wayneh.tw/books/cairn-barebones
  OLD_BASE: /cairn-barebones-docs
  SHARP_IGNORE_GLOBAL_LIBVIPS: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: docs
        run: bun run build

      - name: Generate redirect site
        run: |
          python3 - <<'EOF'
          import html, os
          from pathlib import Path

          target, old_base = os.environ["TARGET_BASE"], os.environ["OLD_BASE"]
          dist, out = Path("docs/dist"), Path("redirect-site")

          def page(url, body_script):
              u = html.escape(url, quote=True)
              return (
                  '<!doctype html><html lang="zh-TW"><head><meta charset="utf-8">'
                  f'<title>已搬家</title><link rel="canonical" href="{u}">'
                  f'<meta http-equiv="refresh" content="0; url={u}">'
                  f"<script>{body_script}</script></head>"
                  f'<body><p>本站已搬到 <a href="{u}">{u}</a>。</p></body></html>\n'
              )

          count = 0
          for src in dist.rglob("*.html"):
              rel = src.relative_to(dist).as_posix()
              if rel == "404.html":
                  continue
              path = rel[: -len("index.html")] if rel.endswith("index.html") else rel
              url = f"{target}/{path}"
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(page(url, f"location.replace({url!r}+location.search+location.hash)"), encoding="utf-8")
              count += 1

          fallback = (
              f"var p=location.pathname.replace(/^{old_base.replace('/', chr(92) + '/')}/, '');"
              f"location.replace({target!r}+p+location.search+location.hash)"
          )
          (out / "404.html").write_text(page(f"{target}/", fallback), encoding="utf-8")
          print(f"{count} redirect pages")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
